name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu"]
        jvm: ["8", "11", "17", "21"]
        include:
          - os: windows
            jvm: 17
    name: ${{ matrix.os }} / JDK${{ matrix.jvm }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:${{ matrix.jvm }}
      - if: ${{ matrix.os != 'windows' }}
        run: sbt test
      - if: ${{ matrix.os == 'windows' }}
        run: sbt testWindows
  docs:
    name: Compile docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/setup-action@v1
      - run: sbt ci-docs
  formatting:
    name: Scalafmt and Scalafix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/setup-action@v1
      - run: cs install metap
      - run: sbt "dogfoodScalafixInterfaces; scalafixAll --check" || metap ./scalafix-tests/integration/target/jvm-2.13/meta/META-INF/semanticdb/scalafix-tests/integration/src/main/scala/scalafix/test/cli/Rules.scala.semanticdb
  mima:
    name: Version Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v1
      - run: sbt versionPolicyCheck
